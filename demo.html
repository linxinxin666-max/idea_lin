<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>idea creator - 抖音生活服务素材神器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2d4a 50%, #0f1e33 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        
        body::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar,
        .main-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        body::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.35);
        }
        
        body::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 8px;
            border: 2px solid rgba(15, 23, 42, 0.4);
        }
        
        body::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
        
        .app {
            display: flex;
            min-height: 100vh;
        }
        
        /* 左边侧边栏 */
        .sidebar {
            width: 380px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px 24px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        /* 数据统计卡片 */
        .stats-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .stats-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .stat-item {
            text-align: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: radial-gradient(circle at 30% 30%, #60a5fa 0%, #1d4ed8 55%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            animation: logoPulse 2.6s ease-in-out infinite;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: -20%;
            background: conic-gradient(from 180deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.55) 20deg, rgba(255,255,255,0) 60deg);
            opacity: 0.35;
            animation: logoShine 3.8s linear infinite;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 55%);
            opacity: 0.7;
            pointer-events: none;
        }

        .logo-spark {
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 16px;
            filter: drop-shadow(0 6px 10px rgba(34, 211, 238, 0.55));
            animation: sparkFlash 2.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes logoPulse {
            0%, 100% { transform: translateZ(0) scale(1); box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35); }
            50% { transform: translateZ(0) scale(1.03); box-shadow: 0 14px 30px rgba(34, 211, 238, 0.35); }
        }

        @keyframes logoShine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes sparkFlash {
            0%, 55%, 100% { transform: scale(0.6) rotate(-12deg); opacity: 0.0; }
            65% { transform: scale(1.15) rotate(10deg); opacity: 1; }
            78% { transform: scale(0.85) rotate(-6deg); opacity: 0.65; }
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff3b30 0%, #ff9500 14%, #ffcc00 28%, #34c759 42%, #00c7be 56%, #0a84ff 70%, #5856d6 84%, #ff2d55 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowShift 3.6s linear infinite;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        /* 日期卡片 */
        .date-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .date-main {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .date-number {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .date-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .date-month-year {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .date-weekday {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .bigday-badge {
            display: none;
            align-self: flex-start;
            margin-top: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #f97316 0%, #ef4444 60%, #f59e0b 100%);
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.35);
        }
        
        /* 天气卡片 */
        .weather-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .weather-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .weather-icon {
            font-size: 32px;
        }
        
        .weather-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .weather-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .weather-location {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .weather-alert {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 12px;
            line-height: 1.4;
            display: none;
        }
        
        /* 加油语卡片 */
        .motivation-card {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.15) 0%, rgba(245, 158, 11, 0.15) 100%);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .motivation-text {
            font-size: 15px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
        }
        
        /* 节假日倒计时 */
        .countdown-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }
        
        .countdown-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .countdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .countdown-item:last-child {
            border-bottom: none;
        }
        
        .countdown-name {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .countdown-days {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        
        .countdown-number {
            font-size: 24px;
            font-weight: 800;
            color: #f59e0b;
        }
        
        .countdown-unit {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }
        
        /* Tab切换 */
        .tabs-container {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-btn {
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: rgba(59, 130, 246, 0.3);
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        /* 专区内容 */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 官方发布专区 - 优先版块 */
        .priority-section {
            margin-bottom: 48px;
        }
        
        .priority-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(249, 115, 22, 0.05) 100%);
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .priority-icon {
            font-size: 28px;
        }
        
        .priority-title {
            font-size: 20px;
            font-weight: 700;
            color: #ef4444;
        }
        
        .priority-badge {
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }
        
        /* 历史版块 */
        .history-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .history-icon {
            font-size: 28px;
        }
        
        .history-title {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }
        
        /* 素材网格布局 */
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        
        /* 历史发布横向滚动 */
        .history-scroll-container {
            overflow-x: auto;
            padding: 8px 4px;
        }
        
        .history-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        
        .history-scroll-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .history-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        .history-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .history-materials-horizontal {
            display: flex;
            gap: 20px;
            padding-bottom: 8px;
        }
        
        .history-materials-horizontal .material-card {
            flex-shrink: 0;
            width: 380px;
        }
        
        /* 素材卡片 */
        .material-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
        }
        
        .material-card.priority {
            border-color: rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
        }
        
        .material-card.history {
            opacity: 0.8;
        }
        
        .material-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .material-date {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.2) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            color: #ef4444;
        }
        
        .history .material-date {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
        }
        
        .material-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        
        .copy-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }
        
        .download-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .download-btn:hover {
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .material-text {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        
        .material-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .material-image {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }
        
        .material-image img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* BD自定义发布区域 - 优化版 */
        .bd-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px;
        }
        
        .bd-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .selector-group {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .selector-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .selector-title-icon {
            font-size: 16px;
        }
        
        .card-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .select-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }
        
        .select-card:hover {
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }
        
        .select-card.selected {
            border-color: #3b82f6;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18) 0%, rgba(29, 78, 216, 0.18) 100%);
        }
        
        .select-icon {
            font-size: 24px;
        }
        
        .select-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .select-desc {
            display: none;
        }
        
        /* 朋友圈预览区 - 企微样式 */
        .preview-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #e5e7eb;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .preview-title {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preview-actions {
            display: flex;
            gap: 12px;
        }
        
        .regenerate-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .regenerate-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            transform: translateY(-2px);
        }
        
        .copy-final-btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .copy-final-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .download-final-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .download-final-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
            transform: translateY(-2px);
        }

        .download-final-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        
        .copy-search-btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .copy-search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
        }
        
        .wecom-moments {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            border: 1px solid #e5e7eb;
        }
        
        .moments-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .moments-header-left {
            display: flex;
            gap: 12px;
        }
        
        .moments-avatar {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

                const professional = items.map(i => buildCourseMomentTemplate(i, 'professional')).filter(Boolean);
                const friendly = items.map(i => buildCourseMomentTemplate(i, 'friendly')).filter(Boolean);

                contentLibrary.professional.business = [...professional, ...(contentLibrary.professional.business || [])];
                contentLibrary.friendly.business = [...friendly, ...(contentLibrary.friendly.business || [])];
            } catch (e) {
                console.error(e);
            }
        }
        
        // 本地存储管理
        const publishStatsKey = 'publishStats';
        
        function getPublishStats() {
            const data = localStorage.getItem(publishStatsKey);
            if (!data) {
                return { today: 0, week: 0, month: 0, lastDate: null };
            }
            return JSON.parse(data);
        }
        
        function savePublishStats(stats) {
            localStorage.setItem(publishStatsKey, JSON.stringify(stats));
        }
        
        function incrementPublishStats() {
            const stats = getPublishStats();
            const todayStr = today.toDateString();
            
            if (stats.lastDate !== todayStr) {
                stats.today = 0;
            }
            
            stats.today++;
            stats.week++;
            stats.month++;
            stats.lastDate = todayStr;
            
            savePublishStats(stats);
            updateStatsDisplay();
        }
        
        function updateStatsDisplay() {
            const stats = getPublishStats();
            document.getElementById('todayCount').textContent = stats.today;
            document.getElementById('weekCount').textContent = stats.week;
            document.getElementById('monthCount').textContent = stats.month;
        }
        
        // Tab切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }
        
        // 渲染官方素材
        function renderMaterials() {
            const priorityContainer = document.getElementById('priorityMaterials');
            const historyContainer = document.getElementById('historyMaterials');
            
            // 只把今天（4.28）的内容放在优先发布，其余的在历史发布
            const priorityMaterials = allMaterials.filter(m => m.date === "4.28");
            const historyMaterials = allMaterials.filter(m => m.date !== "4.28");
            
            priorityContainer.innerHTML = priorityMaterials.map(material => createMaterialCard(material, 'priority')).join('');
            historyContainer.innerHTML = historyMaterials.map(material => createMaterialCard(material, 'history')).join('');
        }
        
        function createMaterialCard(material, type) {
            const imagesHtml = material.images.map(img => 
                `<div class="material-image"><img src="${img}" alt="素材图片"></div>`
            ).join('');
            const cleanText = stripHashtagTags(material.text);
            const firstImage = (material.images && material.images[0]) ? material.images[0] : '';
            
            return `
                <div class="material-card ${type}">
                    <div class="material-header">
                        <span class="material-date">${material.date}</span>
                        <div class="material-actions">
                            <button class="action-btn copy-btn" onclick="copyText('${cleanText.replace(/'/g, "\\'").replace(/\n/g, '\\n')}', ${firstImage ? `['${firstImage.replace(/'/g, "\\'")}']` : '[]'})">
                                📋 复制
                            </button>
                            <button class="action-btn download-btn" onclick="downloadOnly(${firstImage ? `['${firstImage.replace(/'/g, "\\'")}']` : '[]'})">
                                📥 下载
                            </button>
                        </div>
                    </div>
                    <div class="material-text">${cleanText}</div>
                    ${imagesHtml ? `<div class="material-images">${imagesHtml}</div>` : ''}
                </div>
            `;
        }
        
        // 复制文本
        function jumpToWeCom() {
            const schemeUrl = 'wxwork://';
            const fallbackUrl = 'https://work.weixin.qq.com/';
            let fallbackTimer = null;

            try {
                fallbackTimer = setTimeout(() => {
                    window.open(fallbackUrl, '_blank');
                }, 900);

                window.location.href = schemeUrl;

                setTimeout(() => {
                    if (fallbackTimer) clearTimeout(fallbackTimer);
                }, 1200);
            } catch (e) {
                window.open(fallbackUrl, '_blank');
            }
        }

        function safeCopyText(text) {
            const cleanText = stripHashtagTags(text);
            if (!cleanText) return Promise.resolve(false);

            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(cleanText).then(() => true).catch(() => false);
            }

            return new Promise(resolve => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = cleanText;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.left = '-9999px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, ta.value.length);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    resolve(Boolean(ok));
                } catch (e) {
                    resolve(false);
                }
            });
        }

        function downloadImage(url, filename) {
            const safeName = (filename || 'image').replace(/[^\w\-\.]+/g, '_');
            const direct = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = safeName;
                a.rel = 'noopener';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            if (isIOSOrWeCom()) {
                showImageModal(url);
                return Promise.resolve({ mode: 'preview' });
            }

            direct();

            return fetch(url, { mode: 'cors', cache: 'no-store' })
                .then(r => r.ok ? r.blob() : Promise.reject(new Error('fetch failed')))
                .then(blob => {
                    const objectUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objectUrl;
                    a.download = safeName;
                    a.rel = 'noopener';
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
                    return { mode: 'download' };
                })
                .catch(() => {
                    showImageModal(url);
                    try { window.open(url, '_blank', 'noopener'); } catch (e) { direct(); }
                    return { mode: 'open' };
                });
        }

        function downloadImages(images) {
            const list = Array.isArray(images) ? images.filter(Boolean) : [];
            if (list.length === 0) return Promise.resolve();
            const first = list[0];
            const filename = `moments_${Date.now()}.jpg`;
            return downloadImage(first, filename);
        }

        function downloadOnly(images) {
            const list = Array.isArray(images) ? images.filter(Boolean) : [];
            if (list.length === 0) {
                showToast('没有可下载的图片');
                return;
            }
            showToast(isIOSOrWeCom() ? '已打开图片，长按保存到相册' : '已触发图片下载');
            downloadImages(list).then((res) => {
                if (res?.mode === 'download') return;
                if (!isIOSOrWeCom()) showToast('如未下载，请在弹出的图片页另存为');
            });
        }

        function copyText(text, images) {
            const hasImages = Array.isArray(images) && images.filter(Boolean).length > 0;
            if (hasImages) {
                showToast('已触发图片保存（如未下载会打开图片），同时复制文案中…');
                downloadImages(images);
            } else {
                showToast('正在复制文案并跳转企微…');
            }

            safeCopyText(text).then(ok => {
                if (ok) {
                    showToast('已复制到剪贴板，正在跳转企微…');
                } else {
                    showToast('复制受限，已尝试复制并跳转企微…');
                }
            }).finally(() => {
                setTimeout(() => {
                    jumpToWeCom();
                }, hasImages ? 800 : 0);
            });
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function isIOSOrWeCom() {
            const ua = navigator.userAgent || '';
            const isIOS = /iP(hone|ad|od)/.test(ua);
            const isWeCom = /wxwork/i.test(ua);
            return isIOS || isWeCom;
        }

        function showImageModal(url) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('imageModalImg');
            const hint = document.getElementById('imageModalHint');
            if (!modal || !img) return;
            img.src = url;
            hint.textContent = isIOSOrWeCom()
                ? '长按图片即可保存到相册；保存后返回页面继续跳转企微。'
                : '如未自动下载，请在新标签页中右键另存为。';
            modal.classList.add('show');
        }

        function hideImageModal() {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('imageModalImg');
            if (!modal) return;
            modal.classList.remove('show');
            if (img) img.removeAttribute('src');
        }

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('imageModal');
            if (!modal || !modal.classList.contains('show')) return;
            if (e.target === modal) hideImageModal();
        });
        
        // BD选择器
        function initBDSelectors() {
            const personaCards = document.querySelectorAll('#personaGrid .select-card');
            const typeCards = document.querySelectorAll('#contentTypeGrid .select-card');
            
            personaCards.forEach(card => {
                card.addEventListener('click', () => {
                    personaCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    bdState.persona = card.dataset.persona;
                    generateBDContent();
                });
            });
            
            typeCards.forEach(card => {
                card.addEventListener('click', () => {
                    typeCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    bdState.type = card.dataset.type;
                    generateBDContent();
                });
            });
            
            document.getElementById('regenerateBtn').addEventListener('click', generateBDContent);
            document.getElementById('bdDownloadBtn').addEventListener('click', () => {
                if (bdState.currentImage) {
                    downloadOnly([bdState.currentImage]);
                } else {
                    showToast('当前素材没有图片');
                }
            });
            document.getElementById('bdCopyBtn').addEventListener('click', () => {
                copyText(bdState.currentText, bdState.currentImage ? [bdState.currentImage] : []);
                incrementPublishStats();
            });
            
            generateBDContent();
        }
        
        function generateBDContent() {
            const templates = contentLibrary[bdState.persona]?.[bdState.type];
            if (!templates || templates.length === 0) return;
            
            let candidates = templates;
            if (bdState.type === 'live' && !bdState.livePreferredUsed) {
                const appointment = templates.filter(t => {
                    const txt = typeof t === 'string' ? t : (t?.text || '');
                    return String(txt).includes('预约链接');
                });
                if (appointment.length > 0) {
                    candidates = appointment;
                }
                bdState.livePreferredUsed = true;
            }
            const randomIndex = Math.floor(Math.random() * candidates.length);
            const tpl = candidates[randomIndex];

            if (typeof tpl === 'string') {
                bdState.currentText = stripHashtagTags(tpl);
                bdState.currentImage = '';
            } else {
                bdState.currentText = stripHashtagTags(tpl?.text || '');
                bdState.currentImage = tpl?.image || '';
            }

            document.getElementById('momentsContent').textContent = bdState.currentText;
            const imagesEl = document.getElementById('momentsImages');
            const imgEl = document.getElementById('momentsCoverImg');
            const dlBtn = document.getElementById('bdDownloadBtn');
            if (bdState.currentImage) {
                imgEl.src = bdState.currentImage;
                imagesEl.style.display = 'flex';
                if (dlBtn) dlBtn.disabled = false;
            } else {
                imgEl.removeAttribute('src');
                imagesEl.style.display = 'none';
                if (dlBtn) dlBtn.disabled = true;
            }
        }
        
        // 初始化天气
        function initWeather() {
            document.getElementById('weatherText').textContent = '晴朗，25°C';
            document.getElementById('weatherLocation').textContent = '北京';
        }

        // 初始化倒计时
        function initCountdown() {
            const countdownList = document.getElementById('countdownList');
            const next = getNextHoliday();
            if (!next) {
                countdownList.innerHTML = `<div class="countdown-item">
                    <span class="countdown-name">暂无节假日</span>
                    <span class="countdown-days">
                        <span class="countdown-number">-</span>
                        <span class="countdown-unit">天</span>
                    </span>
                </div>`;
                return;
            }

            const diffDays = Math.max(0, next.diffDays ?? 0);
            countdownList.innerHTML = `<div class="countdown-item">
                <span class="countdown-name">${next.name}</span>
                <span class="countdown-days">
                    <span class="countdown-number">${diffDays}</span>
                    <span class="countdown-unit">天</span>
                </span>
            </div>`;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('imageModalClose');
            if (closeBtn) closeBtn.addEventListener('click', hideImageModal);
            extendHolidayLibrary();
            renderMaterials();
            Promise.all([loadLiveMaterials(), loadCourseBusinessMaterials()]).finally(() => {
                initBDSelectors();
                updateStatsDisplay();
                initWeather();
                initCountdown();
            });
        });
    </script>
</body>
