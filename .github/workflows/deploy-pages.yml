name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp demo.html index.html site/
          cp live_materials.json course_materials_business.json rule_center_materials.json site/
          if [ -d posters ]; then cp -R posters site/posters; fi
          if [ -f "出单宝-配图.jpeg" ]; then cp "出单宝-配图.jpeg" site/; fi
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
