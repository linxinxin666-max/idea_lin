  </text>
  <text x="132" y="1260" fill="rgba(255,255,255,0.55)" font-size="22" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
    PR编号：2026011721415
  </text>
