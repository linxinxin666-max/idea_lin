    </text>
  </g>

  <text x="132" y="1200" fill="rgba(255,255,255,0.70)" font-size="24" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
