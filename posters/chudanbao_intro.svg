    </text>
  </g>

  <g>
    <rect x="132" y="740" width="816" height="360" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
    <text x="168" y="808" fill="#ffffff" font-size="36" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
      温和提醒
    </text>
    <text x="168" y="878" fill="rgba(255,255,255,0.82)" font-size="28" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
